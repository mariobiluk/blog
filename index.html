<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mario biluk & virgula | artigos e poemas</title>
<style>
  :root {
    --bg:    #ffffff;
    --fg:    #111111;
    --muted: #888888;
    --rule:  #e4e4e4;
    --serif: Georgia, 'Times New Roman', 'Iowan Old Style', serif;
    --sans:  'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  [hidden] { display: none !important; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding: 0 32px;
  }

  /* ---------- NAV ---------- */
  header {
    max-width: 780px;
    margin: 0 auto;
    padding: 64px 0 0;
  }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    border-bottom: 1px solid var(--fg);
    padding-bottom: 14px;
  }
  .nav-cats, .nav-actions {
    display: flex;
    gap: 36px;
    align-items: center;
  }
  .nav-actions { gap: 22px; }

  nav button {
    background: none;
    border: none;
    padding: 0;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.15s ease;
    white-space: nowrap;
  }
  nav button:hover { color: var(--fg); }
  nav button.active { color: var(--fg); }
  #addBtn { color: var(--fg); font-weight: 700; }

  /* ---------- FILTRO DE AUTOR ---------- */
  .author-filter {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 20px;
    padding: 16px 0 12px;
  }
  .author-filter .filter-label {
    font-family: var(--sans);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--muted);
  }
  .author-filter button {
    background: none;
    border: none;
    padding: 0;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .author-filter button:hover { color: var(--fg); }
  .author-filter button.active {
    color: var(--fg);
    text-decoration: underline;
    text-underline-offset: 5px;
    text-decoration-thickness: 1px;
  }

  /* ---------- LISTA ---------- */
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 8px 0 140px;
  }
  ul { list-style: none; }
  li { border-bottom: 1px solid var(--rule); }
  li.empty, li.status {
    border: 0;
    color: var(--muted);
    font-size: 13px;
    padding: 32px 0;
  }

  li a {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "title    cat"
      "subtitle cat"
      "date     cat";
    gap: 2px 24px;
    padding: 26px 0;
    color: inherit;
    text-decoration: none;
  }
  li a:hover .title { opacity: 0.6; }

  .title {
    grid-area: title;
    font-family: var(--serif);
    font-size: 21px;
    line-height: 1.3;
    letter-spacing: -0.005em;
    transition: opacity 0.15s ease;
  }
  .subtitle {
    grid-area: subtitle;
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    color: var(--muted);
    line-height: 1.4;
    margin-top: 4px;
  }
  .date {
    grid-area: date;
    font-family: var(--sans);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 8px;
  }
  .cat {
    grid-area: cat;
    align-self: start;
    padding-top: 6px;
    font-family: var(--sans);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    white-space: nowrap;
  }

  /* ---------- MODAIS ---------- */
  .modal {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    overflow-y: auto;
    padding: 40px 24px 80px;
  }
  .modal-inner {
    max-width: 640px;
    margin: 40px auto 0;
    position: relative;
  }
  .modal-close {
    position: fixed;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 32px;
    line-height: 1;
    cursor: pointer;
    color: var(--muted);
    padding: 8px 16px;
    z-index: 101;
    font-family: var(--sans);
  }
  .modal-close:hover { color: var(--fg); }

  /* ---------- FORMULÁRIOS ---------- */
  .field { margin-bottom: 26px; }
  .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field .optional {
    text-transform: none;
    letter-spacing: 0.02em;
    font-style: italic;
  }
  .field input,
  .field select {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 10px 0;
    font-family: var(--sans);
    font-size: 15px;
    background: transparent;
    color: var(--fg);
    outline: none;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .field select { cursor: pointer; }
  .field input:focus,
  .field select:focus { border-bottom-color: var(--fg); }
  .field textarea {
    width: 100%;
    resize: vertical;
    border: 1px solid var(--rule);
    padding: 14px;
    min-height: 240px;
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.65;
    background: transparent;
    color: var(--fg);
    outline: none;
    border-radius: 0;
  }
  .field textarea:focus { border-color: var(--fg); }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .btn-submit {
    background: var(--fg);
    color: var(--bg);
    border: none;
    padding: 14px 34px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .btn-submit:hover { opacity: 0.8; }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

  .form-error {
    color: var(--fg);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 20px;
    padding: 10px 14px;
    border: 1px solid var(--fg);
  }

  /* ---------- READER ---------- */
  .modal-reader .modal-inner { max-width: 680px; margin-top: 20px; }
  .reader-cat {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .reader-title {
    font-family: var(--serif);
    font-size: 44px;
    line-height: 1.12;
    letter-spacing: -0.015em;
    margin-bottom: 14px;
    font-weight: normal;
  }
  .reader-subtitle {
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 26px;
  }
  .reader-meta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    padding-bottom: 26px;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--rule);
  }
  .reader-body {
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.75;
    white-space: pre-wrap;
    color: var(--fg);
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 640px) {
    body { padding: 0 22px; }
    header { padding-top: 44px; }
    main { padding-bottom: 90px; }
    nav { gap: 12px; }
    .nav-cats { gap: 22px; }
    .nav-actions { gap: 16px; }

    .author-filter { gap: 14px; padding: 14px 0 8px; }

    li a {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "cat      cat"
        "title    title"
        "subtitle subtitle"
        "date     date";
      gap: 6px 0;
      padding: 22px 0;
    }
    .cat { padding-top: 0; }
    .title { font-size: 19px; }
    .date { margin-top: 4px; }

    .modal { padding: 24px 22px 60px; }
    .modal-inner { margin-top: 24px; }
    .field-row { grid-template-columns: 1fr; gap: 0; }
    .reader-title { font-size: 32px; }
    .reader-subtitle { font-size: 17px; }
    .reader-body { font-size: 17px; }
  }
</style>
</head>
<body>

<header>
  <nav>
    <div class="nav-cats" id="navCats">
      <button data-cat="artigos">Artigos</button>
      <button data-cat="letras">Letras</button>
    </div>
    <div class="nav-actions">
      <button id="addBtn" hidden>+ Adicionar</button>
      <button id="authBtn">Entrar</button>
    </div>
  </nav>

  <!-- Filtro por autor (preenchido via JS com AUTHOR_FILTERS) -->
  <div class="author-filter" id="authorFilter">
    <span class="filter-label">autor</span>
    <button data-author="" class="active">todos</button>
  </div>
</header>

<main>
  <ul id="list"></ul>
</main>

<!-- ============ MODAL: LOGIN ============ -->
<div class="modal" id="loginModal" hidden>
  <button class="modal-close" data-close>×</button>
  <div class="modal-inner" style="max-width:380px;">
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="loginUser">Usuário</label>
        <input type="text" id="loginUser" name="user" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPass">Senha</label>
        <input type="password" id="loginPass" name="pass" autocomplete="current-password" required>
      </div>
      <p class="form-error" id="loginError" hidden>Credenciais inválidas.</p>
      <button type="submit" class="btn-submit">Entrar</button>
    </form>
  </div>
</div>

<!-- ============ MODAL: ADICIONAR POST ============ -->
<div class="modal" id="addModal" hidden>
  <button class="modal-close" data-close>×</button>
  <div class="modal-inner">
    <form id="addForm">
      <div class="field">
        <label for="fTitle">Título</label>
        <input type="text" id="fTitle" name="title" required>
      </div>
      <div class="field">
        <label for="fSubtitle">Subtítulo <span class="optional">(opcional)</span></label>
        <input type="text" id="fSubtitle" name="subtitle">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fCategory">Categoria</label>
          <select id="fCategory" name="category" required>
            <option value="artigos">Artigo</option>
            <option value="letras">Letra</option>
          </select>
        </div>
        <div class="field">
          <label for="fAuthor">Autor</label>
          <input type="text" id="fAuthor" name="author" required>
        </div>
      </div>
      <div class="field">
        <label for="fContent">Texto</label>
        <textarea id="fContent" name="content" required placeholder="Cole aqui o texto. Linhas em branco separam parágrafos."></textarea>
      </div>
      <p class="form-error" id="addError" hidden></p>
      <button type="submit" class="btn-submit" id="addSubmit">Adicionar</button>
    </form>
  </div>
</div>

<!-- ============ MODAL: LEITOR ============ -->
<div class="modal modal-reader" id="readerModal" hidden>
  <button class="modal-close" data-close>×</button>
  <div class="modal-inner">
    <div id="readerContent"></div>
  </div>
</div>

<script>
  /* ============================================================
     CONFIGURAÇÃO DO JSONBIN — já preenchida, mantém o mesmo bin.
     ============================================================ */
  const JSONBIN_CONFIG = {
    binId:    '6ad7c88bffd5d160537d305b',
    readKey:  '$2a$10$m71wWSwIfXW5AujNCi5oeOZZFq6ZIszartS9x6H6Cl8wIZzItZ1RK',
    writeKey: '$2a$10$m71wWSwIfXW5AujNCi5oeOZZFq6ZIszartS9x6H6Cl8wIZzItZ1RK'
  };

  /* ============================================================
     CREDENCIAIS DO PAINEL (login superficial)
     ============================================================ */
  const ADMIN_USER = 'admin';
  const ADMIN_PASS = 'admin123';

  /* ============================================================
     CHAVE DE SESSÃO (localStorage)
     ============================================================ */
  const KEY_AUTH = 'repositorio_auth_v1';

  /* ============================================================
     FILTROS DE AUTOR
     Adicione/remova autores aqui. Cada entrada:
       label → o que aparece no botão
       match → trecho normalizado (sem acento, minúsculo) que
               será buscado (substring) no campo "author".
     ============================================================ */
  const AUTHOR_FILTERS = [
    { label: 'Mário Biluk', match: 'mario biluk' },
    { label: 'Vírgula',     match: 'virgula' }
  ];

  /* ============================================================
     POSTS DE EXEMPLO — só aparecem se o bin estiver vazio
     ou inacessível. Somem no primeiro post real.
     ============================================================ */
  const seedPosts = [
    {
      id: 'seed-1', date: '2024-11-20',
      title: 'Sobre a queda dos impérios',
      subtitle: 'Notas sobre ciclos históricos',
      category: 'artigos', author: 'Redação',
      content: 'Ao longo da história, os grandes sistemas raramente ruem de um só golpe. Ruem por dentro, lentamente, sob o peso das próprias contradições.\n\nEste é um texto de exemplo. Assim que você adicionar seu primeiro post real, esta mensagem deixa de aparecer.'
    },
    {
      id: 'seed-2', date: '2024-11-02',
      title: 'Canção para um fim de tarde',
      category: 'letras', author: 'Redação',
      content: 'A tarde cai devagar\nsobre a cidade cansada;\nalguém ainda espera\no fim de uma outra jornada.'
    }
  ];

  /* ============================================================
     UTILITÁRIOS
     ============================================================ */
  const catLabel = { artigos: 'artigo', letras: 'letra', poemas: 'poema' };
  const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

  function fmtDate(iso) {
    const [y, m, d] = iso.split('-');
    return `${+d} ${months[+m - 1]} ${y}`;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function uid() {
    return 'p-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  }

  // Remove acentos e caixa alta para busca de autor.
  function norm(s) {
    return String(s || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  /* ============================================================
     JSONBIN — camada de dados
     ============================================================ */
  const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';

  function stripPlaceholder(list) {
    if (!Array.isArray(list)) return [];
    return list.filter(item => item && !item._placeholder);
  }

  async function fetchPosts() {
    const res = await fetch(
      `${JSONBIN_BASE}/${JSONBIN_CONFIG.binId}/latest?ts=${Date.now()}`,
      { headers: { 'X-Access-Key': JSONBIN_CONFIG.readKey } }
    );
    if (!res.ok) throw new Error(`JSONBin GET falhou (${res.status})`);
    const json = await res.json();
    return stripPlaceholder(json.record);
  }

  async function putPosts(posts) {
    const payload = posts.length ? posts : [{ _placeholder: true }];
    const res = await fetch(`${JSONBIN_BASE}/${JSONBIN_CONFIG.binId}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Access-Key': JSONBIN_CONFIG.writeKey
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(`JSONBin PUT falhou (${res.status})`);
    const json = await res.json();
    return stripPlaceholder(json.record);
  }

  /* ============================================================
     ESTADO EM MEMÓRIA
     ============================================================ */
  let allPosts = [];
  let activeCat = null;
  let activeAuthor = null;
  let loadError = null;

  /* ============================================================
     AUTH
     ============================================================ */
  function isLoggedIn() { return localStorage.getItem(KEY_AUTH) === '1'; }
  function doLogin(u, p) {
    if (u === ADMIN_USER && p === ADMIN_PASS) {
      localStorage.setItem(KEY_AUTH, '1');
      return true;
    }
    return false;
  }
  function doLogout() { localStorage.removeItem(KEY_AUTH); }

  /* ============================================================
     MODAIS
     ============================================================ */
  function openModal(el) {
    el.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeModal(el) {
    el.hidden = true;
    document.body.style.overflow = '';
  }
  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => closeModal(btn.closest('.modal')));
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal:not([hidden])').forEach(closeModal);
    }
  });

  /* ============================================================
     ELEMENTOS
     ============================================================ */
  const listEl        = document.getElementById('list');
  const navCats       = document.getElementById('navCats');
  const catButtons    = navCats.querySelectorAll('button');
  const authorFilterEl = document.getElementById('authorFilter');
  const addBtn        = document.getElementById('addBtn');
  const authBtn       = document.getElementById('authBtn');
  const loginModal    = document.getElementById('loginModal');
  const addModal      = document.getElementById('addModal');
  const readerModal   = document.getElementById('readerModal');
  const readerContent = document.getElementById('readerContent');
  const loginForm     = document.getElementById('loginForm');
  const addForm       = document.getElementById('addForm');
  const loginError    = document.getElementById('loginError');
  const addError      = document.getElementById('addError');
  const addSubmit     = document.getElementById('addSubmit');

  /* ============================================================
     CONSTRÓI OS BOTÕES DE FILTRO DE AUTOR
     ============================================================ */
  AUTHOR_FILTERS.forEach(f => {
    const btn = document.createElement('button');
    btn.dataset.author = f.match;
    btn.textContent = f.label;
    authorFilterEl.appendChild(btn);
  });
  const authorButtons = authorFilterEl.querySelectorAll('button');

  /* ============================================================
     RENDER
     ============================================================ */
  function render() {
    listEl.innerHTML = '';

    if (loadError && allPosts.length) {
      const li = document.createElement('li');
      li.className = 'status';
      li.textContent = '⚠ Não foi possível carregar do JSONBin. Exibindo posts de exemplo. Verifique suas chaves.';
      listEl.appendChild(li);
    }

    let data = allPosts.slice();

    if (activeCat) {
      data = data.filter(p => p.category === activeCat);
    }

    if (activeAuthor) {
      data = data.filter(p => norm(p.author).includes(activeAuthor));
    }

    data.sort((a, b) => b.date.localeCompare(a.date));

    if (!data.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = allPosts.length === 0
        ? '— vazio'
        : '— nenhum resultado para este filtro';
      listEl.appendChild(li);
      return;
    }

    data.forEach(p => {
      const li = document.createElement('li');
      const a  = document.createElement('a');
      a.href = '#';
      a.addEventListener('click', e => {
        e.preventDefault();
        openReader(p);
      });

      const meta = [fmtDate(p.date)];
      if (p.author && p.author !== '—') meta.push(escapeHtml(p.author));

      a.innerHTML = `
        <span class="cat">${catLabel[p.category] || p.category}</span>
        <span class="title">${escapeHtml(p.title)}</span>
        ${p.subtitle ? `<span class="subtitle">${escapeHtml(p.subtitle)}</span>` : ''}
        <span class="date">${meta.join(' · ')}</span>
      `;
      li.appendChild(a);
      listEl.appendChild(li);
    });
  }

  /* ============================================================
     LEITOR
     ============================================================ */
  function openReader(p) {
    const meta = [fmtDate(p.date)];
    if (p.author && p.author !== '—') meta.push(escapeHtml(p.author));

    readerContent.innerHTML = `
      <div class="reader-cat">${catLabel[p.category] || p.category}</div>
      <h1 class="reader-title">${escapeHtml(p.title)}</h1>
      ${p.subtitle ? `<p class="reader-subtitle">${escapeHtml(p.subtitle)}</p>` : ''}
      <div class="reader-meta">${meta.join(' · ')}</div>
      <div class="reader-body">${escapeHtml(p.content)}</div>
    `;
    openModal(readerModal);
    readerModal.scrollTop = 0;
  }

  /* ============================================================
     FILTRO: CATEGORIA
     ============================================================ */
  catButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = (activeCat === btn.dataset.cat) ? null : btn.dataset.cat;
      catButtons.forEach(b => b.classList.toggle('active', b.dataset.cat === activeCat));
      render();
    });
  });

  /* ============================================================
     FILTRO: AUTOR (combina com o de categoria)
     ============================================================ */
  authorButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.author || null;
      if (val && val === activeAuthor) {
        activeAuthor = null;
      } else {
        activeAuthor = val;
      }
      authorButtons.forEach(b => {
        const bVal = b.dataset.author || null;
        b.classList.toggle('active', bVal === activeAuthor);
      });
      render();
    });
  });

  /* ============================================================
     AUTH UI
     ============================================================ */
  function updateAuthUI() {
    if (isLoggedIn()) {
      authBtn.textContent = 'Sair';
      addBtn.hidden = false;
    } else {
      authBtn.textContent = 'Entrar';
      addBtn.hidden = true;
    }
  }

  authBtn.addEventListener('click', () => {
    if (isLoggedIn()) {
      doLogout();
      updateAuthUI();
    } else {
      loginError.hidden = true;
      loginForm.reset();
      openModal(loginModal);
      setTimeout(() => loginForm.user.focus(), 50);
    }
  });

  addBtn.addEventListener('click', () => {
    addForm.reset();
    addError.hidden = true;
    addSubmit.disabled = false;
    addSubmit.textContent = 'Adicionar';
    openModal(addModal);
    setTimeout(() => addForm.title.focus(), 50);
  });

  /* ============================================================
     FORM: LOGIN
     ============================================================ */
  loginForm.addEventListener('submit', e => {
    e.preventDefault();
    const user = loginForm.user.value.trim();
    const pass = loginForm.pass.value;
    if (doLogin(user, pass)) {
      closeModal(loginModal);
      loginForm.reset();
      loginError.hidden = true;
      updateAuthUI();
    } else {
      loginError.hidden = false;
    }
  });

  /* ============================================================
     FORM: ADICIONAR
     ============================================================ */
  addForm.addEventListener('submit', async e => {
    e.preventDefault();
    if (!isLoggedIn()) return;

    const fd = new FormData(addForm);
    const post = {
      id: uid(),
      date: new Date().toISOString().slice(0, 10),
      title:    (fd.get('title')    || '').trim(),
      subtitle: (fd.get('subtitle') || '').trim(),
      category:  fd.get('category') || 'artigos',
      author:   (fd.get('author')   || '').trim(),
      content:  (fd.get('content')  || '').trim()
    };

    if (!post.title || !post.author || !post.content) {
      addError.textContent = 'Preencha título, autor e texto.';
      addError.hidden = false;
      return;
    }

    addSubmit.disabled = true;
    addSubmit.textContent = 'Salvando…';
    addError.hidden = true;

    try {
      const current = await fetchPosts();
      current.unshift(post);
      const saved = await putPosts(current);
      allPosts = saved;
      loadError = null;

      addForm.reset();
      closeModal(addModal);
      render();
    } catch (err) {
      console.error(err);
      addError.textContent = 'Falha ao salvar. Verifique sua conexão e as chaves do JSONBin.';
      addError.hidden = false;
      addSubmit.disabled = false;
      addSubmit.textContent = 'Adicionar';
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  async function boot() {
    updateAuthUI();

    listEl.innerHTML = '<li class="status">Carregando…</li>';

    try {
      const remote = await fetchPosts();
      allPosts = remote.length ? remote : seedPosts.slice();
      loadError = null;
    } catch (err) {
      console.error(err);
      allPosts = seedPosts.slice();
      loadError = err.message;
    }

    render();
  }

  boot();
</script>

</body>
</html>
